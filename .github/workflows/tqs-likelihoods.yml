name: TQS Planck ACT likelihood gate

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  cmb-likelihoods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CLASS
        run: make -j2 class
      - name: Run high-l LCDM
        run: ./class .github/tqs/lcdm_likelihood.ini
      - name: Run high-l TQS
        id: runtqs
        continue-on-error: true
        run: ./class .github/tqs/tqs_likelihood.ini
      - name: Install likelihood dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy sacc cobaya astropy
          git clone --depth 1 https://github.com/heatherprince/planck-lite-py.git external_planck_lite
          git clone --depth 1 https://github.com/ACTCollaboration/DR6-ACT-lite.git external_act_dr6
          python -m pip install -e external_act_dr6
          mkdir -p likelihood_packages
          cobaya-install act_dr6_cmbonly -p likelihood_packages
      - name: Score Planck and ACT
        shell: bash
        run: |
          TQS_ARG=""
          if [ -f output/like_tqs_cl_lensed.dat ]; then
            TQS_ARG="--tqs output/like_tqs_cl_lensed.dat"
          fi
          python .github/tqs/score_cmb_likelihoods.py \
            --lcdm output/like_lcdm_cl_lensed.dat \
            $TQS_ARG \
            --planck-repo external_planck_lite \
            --act-data likelihood_packages \
            --output output/tqs_cmb_likelihoods.json
      - name: Record TQS physics gate
        shell: bash
        run: |
          echo "TQS_CLASS_STEP_OUTCOME=${{ steps.runtqs.outcome }}" > output/tqs_likelihood_gate.txt
          cat output/tqs_cmb_likelihoods.json
      - uses: actions/upload-artifact@v4
        with:
          name: tqs-planck-act-likelihoods
          path: |
            output/tqs_cmb_likelihoods.json
            output/tqs_likelihood_gate.txt
            output/like_lcdm_cl_lensed.dat
            output/like_tqs_cl_lensed.dat